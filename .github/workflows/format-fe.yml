name: Check Frontend Format

on:
  pull_request:
    branches:
      - '*'
    paths:
      - 'frontend/**'
      - '.github/workflows/format-fe.yml'

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # skapp-ui comes from a private registry and isn't needed for these checks
      - name: Install dependencies without skapp-ui
        run: |
          npm pkg delete dependencies.@rootcodelabs/skapp-ui
          npm install --no-audit --no-fund --ignore-scripts

      # Check only the files changed in the PR until existing files are formatted
      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- . > all-changed-files.txt
          sed 's|^frontend/||' all-changed-files.txt > changed-files.txt
          if [ ! -s changed-files.txt ]; then
            echo "No frontend files changed"
            exit 0
          fi
          xargs -d '\n' -a changed-files.txt npx prettier --check --ignore-unknown --no-error-on-unmatched-pattern
