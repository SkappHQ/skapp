name: Build Node.js App

# PR trigger disabled until an NPM_READ_TOKEN secret is added; npm install needs
# it to fetch @rootcodelabs/skapp-ui from GitHub Packages
on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build project
        run: |
          cd frontend
          npm run build
