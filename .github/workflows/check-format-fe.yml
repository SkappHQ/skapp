name: Check Node.js App Formatting

on:
  pull_request:
    branches:
      - '*'

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Check formatting
        run: |
          cd frontend
          npm run check-format
