name: PR Checklist

on:
  pull_request_target:
    types: [opened]
    branches: [develop]

permissions:
  pull-requests: write

jobs:
  attach-checklist:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Attach shared checklist
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKLIST_TOKEN: ${{ secrets.PR_CHECKLIST_TOKEN }}
          PR_PATH: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          CHECKLIST_SOURCE: repos/rootcodelabs/skapp-ep/contents/.github/pr-checklist.md?ref=main
        run: |
          if [ -z "$CHECKLIST_TOKEN" ]; then
            echo "::warning::PR_CHECKLIST_TOKEN is not set; checklist not attached"
            exit 0
          fi
          CHECKLIST=$(GH_TOKEN="$CHECKLIST_TOKEN" gh api "$CHECKLIST_SOURCE" -H "Accept: application/vnd.github.raw" | tr -d '\r')
          MARKER=$(head -n 1 <<< "$CHECKLIST")
          if [ -z "$MARKER" ]; then
            echo "::error::The shared checklist must start with its heading line"
            exit 1
          fi
          BODY=$(gh api "$PR_PATH" --jq '.body // ""' | tr -d '\r')
          if grep -qxF "$MARKER" <<< "$BODY"; then
            exit 0
          fi
          if [ -n "$BODY" ]; then
            BODY=$(printf '%s\n\n%s' "$BODY" "$CHECKLIST")
          else
            BODY=$CHECKLIST
          fi
          jq -n --arg body "$BODY" '{body: $body}' | gh api -X PATCH "$PR_PATH" --input - > /dev/null
